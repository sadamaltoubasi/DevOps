---
- name: Build and Deploy vProfile Application using Docker
  hosts: appsrvgrp
  become: yes
  vars:
    app_dir: "/opt/app"

  tasks:

    - name: Install prerequisites for Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip 
        state: present
        force_apt_get: yes

    - name: Add Docker GPG apt Key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Install Docker python module
      ansible.builtin.pip:
        name: docker
        state: present

  #-----------------------------------------------------------------------------------------------------------
  
    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy Dockerfile to the server
      copy:
        src: ./app/Dockerfile 
        dest: "{{ app_dir }}/Dockerfile"

    - name: Ensure docker network 'vprof-net' exists
      community.docker.docker_network:
        name: vprof-net
        state: present

    - name: Build Docker Image from Dockerfile
      community.docker.docker_image:
        build:
          path: "{{ app_dir }}"
        name: app01
        tag: latest
        source: build

    - name: Run Tomcat 10 Application Container within vprof-net
      community.docker.docker_container:
        name: app01
        image: app01:latest
        state: started
        restart_policy: unless-stopped
        network_mode: vprof-net 
        ports:
          - "8080:8080"