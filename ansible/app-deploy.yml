---
- name: Deploy Docker Application from ECR (Simplified)
  hosts: appsrvgrp
  become: yes

  vars:
    aws_region: "us-east-1"
    ecr_registry: "579275327561.dkr.ecr.us-east-1.amazonaws.com"
    ecr_repo_name: "app01"
    image_tag: "{{ image_tag_env | default('latest') }}"

  tasks:
  
    - name: Install prerequisites for Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip 
        state: present
        update_cache: yes

    - name: Add Docker GPG apt Key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker python module
      ansible.builtin.pip:
        name: docker
        state: present

    - name: Ensure docker network 'vprof-net' exists
      community.docker.docker_network:
        name: vprof-net
        state: present

  #-----------------------------------------------------------------------------------------------------------
  

    - name: Ensure aws-cli is installed
      apt:
        name: awscli
        state: present
        update_cache: yes
        
    - name: Login to AWS ECR
      shell: "aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}"

    - name: Pull Docker Image
      shell: "docker pull {{ ecr_registry }}/{{ ecr_repo_name }}:{{ image_tag }}"

    - name: Remove Old Container if exists
      shell: "docker rm -f vprofile-app"
      failed_when: false # حتى لا يفشل الـ Playbook إذا لم يكن هناك حاوية قديمة تعمل

    - name: Run New Container
      shell: >
        docker run -d --name vprofile-app 
        --network vprof-net
        --restart always 
        -p 8080:8080 
        {{ ecr_registry }}/{{ ecr_repo_name }}:{{ image_tag }}
