---
- name: Deploy Docker Application from ECR (Simplified)
  hosts: appsrvgrp
  become: yes

  vars:
    aws_region: "us-east-1"
    ecr_registry: "579275327561.dkr.ecr.us-east-1.amazonaws.com"
    ecr_repo_name: "app01"
    image_tag: "{{ image_tag_env | default('latest') }}"

  tasks:
  
    - name: Install prerequisites for Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip 
        state: present
        update_cache: yes

    - name: Add Docker GPG apt Key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker python module
      ansible.builtin.pip:
        name: docker
        state: present

    - name: Ensure docker network 'vprof-net' exists
      community.docker.docker_network:
        name: vprof-net
        state: present

  #-----------------------------------------------------------------------------------------------------------

    - name: Ensure aws-cli is installed
      apt:
        name: awscli
        state: present
        update_cache: yes
        
    - name: Login to AWS ECR
      shell: "aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}"
      changed_when: false

    - name: Pull Docker Image
      shell: "docker pull {{ ecr_registry }}/{{ ecr_repo_name }}:{{ image_tag }}"
      # نطلق الـ Handler فقط إذا تم سحب صورة جديدة أو تحديث جديد فعلياً
      notify: Recreate application container 

    - name: Read DB configuration from AWS SSM
      ansible.builtin.set_fact:
        db_url: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/db_url', region='us-east-1') }}"
        db_user: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/db_user', region='us-east-1') }}"
        db_pass: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/db_pass', region='us-east-1') }}"
        rmq_user: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/rmq_user', region='us-east-1') }}"
        rmq_pass: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/rmq_pass', region='us-east-1') }}"


    - name: Run Application Docker Container with Env Variables
      community.docker.docker_container:
        name: vprofile-app
        image: "{{ ecr_registry }}/{{ ecr_repo_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        network_mode: vprof-net
        ports:
          - "8080:8080"
        env:
          DB_URL: "{{ db_url }}"
          DB_USER: "{{ db_user }}"
          DB_PASS: "{{ db_pass }}"
          RMQ_USER: "{{ rmq_user }}"
          RMQ_PASS: "{{ rmq_pass }}"

#======= الـ handlers هنا تبدأ من أول السطر بدون مسافات زائدة وتوازي قسم الـ tasks =======
  handlers:
    - name: Recreate application container
      community.docker.docker_container:
        name: vprofile-app
        image: "{{ ecr_registry }}/{{ ecr_repo_name }}:{{ image_tag }}"
        state: started
        recreate: yes 
        restart_policy: unless-stopped
        network_mode: vprof-net
        ports:
          - "8080:8080"
        env:
          DB_URL: "{{ db_url }}"
          DB_USER: "{{ db_user }}"
          DB_PASS: "{{ db_pass }}"
          RMQ_USER: "{{ rmq_user }}"
          RMQ_PASS: "{{ rmq_pass }}"