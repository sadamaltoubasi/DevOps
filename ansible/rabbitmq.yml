---
- name: Deploy RabbitMQ Container using Docker
  hosts: rmqsrvgrp
  become: yes
  tasks:

    - name: Install prerequisites for Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip 
        state: present
        update_cache: yes

    - name: Add Docker GPG apt Key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker python module
      ansible.builtin.pip:
        name: docker
        state: present


  #-----------------------------------------------------------------------------------------------------------
  
    - name: Ensure python3-docker is installed (Required for Ansible docker module)
      apt:
        name: python3-docker
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure docker network 'vprof-net' exists
      community.docker.docker_network:
        name: vprof-net
        state: present


    - name: Read RabbitMQ configuration from AWS SSM
      ansible.builtin.set_fact:
        rmq_user: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/rmq_user', region='us-east-1') }}"
        rmq_pass: "{{ lookup('amazon.aws.aws_ssm', '/vprofile/staging/rmq_pass', region='us-east-1') }}"


    - name: Run RabbitMQ Management Container
      community.docker.docker_container:
        name: rmq01
        image: rabbitmq:3-management-alpine
        state: started
        restart_policy: unless-stopped
        network_mode: vprof-net
        ports:
          - "5672:5672"
          - "15672:15672"
        env:
          RABBITMQ_DEFAULT_USER: "admin"
          RABBITMQ_DEFAULT_PASS: "admin123"
      notify: Restart rabbitmq container
  
  handlers:
    - name: Restart rabbitmq container
      community.docker.docker_container:
        name: rmq01
        image: rabbitmq:3-management-alpine
        state: started
        restart: true
