version: 0.2

env:
  parameter-store:
    LOGIN: "LOGIN"
    HOST: "HOST"
    Organization: "Organization"
    Project: "Project"

phases:
  install:
    commands:
      # لم نعد بحاجة لتحميل Java أو Maven أو Sonar.. كلها موجودة داخل الصورة
      - cp ./settings.xml /root/.m2/settings.xml
      - export CODEARTIFACT_AUTH_TOKEN=`aws codeartifact get-authorization-token --domain vpro-maven --domain-owner 579275327561 --region us-east-1 --query authorizationToken --output text`

  build:
    commands:
      - echo "Starting Build and Analysis..."
      - mvn test
      - mvn checkstyle:checkstyle
      - mvn sonar:sonar \
          -Dsonar.login=$LOGIN \
          -Dsonar.host.url=$HOST \
          -Dsonar.projectKey=$Project \
          -Dsonar.organization=$Organization \
          -Dsonar.java.binaries=target/test-classes/com/visualpathit/account/controllerTest/ \
          -Dsonar.junit.reportsPath=target/surefire-reports/ \
          -Dsonar.jacoco.reportsPath=target/jacoco.exec \
          -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
      
      - echo "Waiting for Quality Gate..."
      - sleep 5
      - curl -s https://sonarcloud.io/api/qualitygates/project_status?projectKey=$Project > result.json
      - if [ $(jq -r '.projectStatus.status' result.json) = "ERROR" ]; then echo "Quality Gate Failed"; exit 1; fi

artifacts:
  files:
    - target/*.war
  discard-paths: yes